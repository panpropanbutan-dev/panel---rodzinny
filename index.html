<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e151c"><title>Panel rodzinny</title>
<style>
:root{--bg:#0e151c;--card:#18232d;--text:#f4f7fa;--muted:#9daab4;--n:#f3c5cf;--u:#c5daf2;--s:#d4e8d8;--x:#f1dfaa;--a:#d9cff0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:12px}main{max-width:560px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;padding:4px 2px 12px}.day{font-size:11px;letter-spacing:2px;color:var(--muted)}.date{font-size:23px;font-weight:850}.clock{font-size:30px;font-weight:850;text-align:right}.weather{text-align:right;font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{border-radius:18px;padding:14px;color:#172029}.n{background:var(--n)}.u{background:var(--u)}.s{background:var(--s);grid-column:1/-1}.d{background:var(--card);color:white;margin-top:9px}.x{background:var(--x);color:#28251b;margin-top:9px}.t{font-size:11px;font-weight:850;letter-spacing:1px;margin-bottom:8px}.name{font-size:23px;font-weight:950}.item{font-size:13px;margin:8px 0;line-height:1.3}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4c9863;margin-right:7px}.row{display:flex;justify-content:space-between;gap:10px}.big{font-size:17px;font-weight:850}.small{font-size:10px;color:#64717b}.d .small{color:var(--muted)}.tl{display:grid;grid-template-columns:52px 10px 1fr;gap:7px;margin:9px 0;font-size:13px}.tl .dot{margin-top:5px;background:#9b78ce}.foot{margin-top:9px;background:var(--a);color:#222;border-radius:16px;text-align:center;padding:11px;font-weight:850}.status{text-align:center;color:#64717b;font-size:9px;margin-top:7px}
</style></head><body><main>
<header class="head"><div><div class="day" id="day"></div><div class="date" id="date"></div></div><div><div class="clock" id="clock"></div><div class="weather" id="weather">Wrocław • pogoda…</div></div></header>
<div class="grid"><section class="card n"><div class="name">NINA</div><div id="nina"></div><div class="item">💊 Tabletka</div></section><section class="card u"><div class="name">ULA</div><div id="ula"></div></section>
<section class="card s"><div class="t">SZKOŁA • DZIŚ</div><div class="row"><div><div class="big">SP Dmowskiego</div><div class="small">Dmowskiego 17</div></div><div style="text-align:right"><div class="small">sugerowany wyjazd</div><div class="big">08:15</div></div></div><div class="small" style="margin-top:7px">Osobowicka 131 → Dmowskiego 17</div></section></div>
<section class="card d"><div class="t">PLAN NA DZIŚ</div><div id="plan"></div></section>
<section class="card x"><div class="t">NAJBLIŻSZE</div><div id="next"></div></section>
<div class="foot">MIŁEGO DNIA! ❤️</div><div class="status">Panel rodzinny • dane z data.json</div>
</main>
<script>
const days=['NIEDZIELA','PONIEDZIAŁEK','WTOREK','ŚRODA','CZWARTEK','PIĄTEK','SOBOTA'];
const keys=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const months=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const d=new Date(),w=d.getDay();day.textContent=days[w];date.textContent=`${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
function tick(){clock.textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000);
fetch('data.json').then(r=>r.json()).then(data=>{
 const list=data.schedule[keys[w]]||[];
 const n=list.filter(x=>x[1]==='Nina'),u=list.filter(x=>x[1]==='Ula');
 nina.innerHTML=n.length?n.map(x=>`<div class="item"><span class="dot"></span><b>${x[0]}</b> • ${x[2]}</div>`).join(''):'<div class="item">Brak zajęć</div>';
 ula.innerHTML=u.length?u.map(x=>`<div class="item"><span class="dot"></span><b>${x[0]}</b> • ${x[2]}</div>`).join(''):'<div class="item">Brak zajęć</div>';
 plan.innerHTML=list.length?list.map(x=>`<div class="tl"><span>${x[0]}</span><span class="dot"></span><span>${x[1]} — ${x[2]}</span></div>`).join(''):'<div class="small">Dziś brak zajęć. 🎉</div>';
 const upcoming=data.one_off.filter(x=>new Date(x[0]+'T'+x[1])>=d).sort((a,b)=>(a[0]+a[1]).localeCompare(b[0]+b[1]))[0];
 next.innerHTML=upcoming?`<b>${upcoming[0].split('-').reverse().join('.')} • ${upcoming[1]}</b> — ${upcoming[2]} — ${upcoming[3]}`:'Brak najbliższych wydarzeń.';
}).catch(()=>{plan.textContent='Nie udało się pobrać danych.'});
fetch('https://api.open-meteo.com/v1/forecast?latitude=51.1079&longitude=17.0385&current=temperature_2m,weather_code&timezone=Europe%2FWarsaw').then(r=>r.json()).then(j=>{const names={0:'bezchmurnie',1:'pogodnie',2:'częściowe zachmurzenie',3:'pochmurno',45:'mgła',48:'mgła',51:'mżawka',53:'mżawka',55:'mżawka',61:'deszcz',63:'deszcz',65:'deszcz',71:'śnieg',73:'śnieg',75:'śnieg',80:'przelotny deszcz',81:'deszcz',82:'silny deszcz',95:'burza',96:'burza',99:'burza'};weather.textContent=`Wrocław • ${Math.round(j.current.temperature_2m)}° • ${names[j.current.weather_code]||''}`}).catch(()=>weather.textContent='Wrocław • pogoda niedostępna');
</script></body></html>
